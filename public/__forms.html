<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form definitions</title></head>
<body>
  <form name="founding-family" method="POST" data-netlify="true" data-netlify-honeypot="website" hidden>
    <input type="hidden" name="form-name" value="founding-family">
    <input name="firstName" type="text">
    <input name="email" type="email">
    <input name="postcode" type="text">
    <input name="role" type="text">
    <input name="consent" type="text">
    <input name="website" type="text">
  </form>

  <form name="community-interest" method="POST" data-netlify="true" data-netlify-honeypot="website" hidden>
    <input type="hidden" name="form-name" value="community-interest">
    <input name="name" type="text">
    <input name="email" type="email">
    <input name="organisation" type="text">
    <input name="location" type="text">
    <input name="organisationType" type="text">
    <textarea name="message"></textarea>
    <input name="consent" type="text">
    <input name="website" type="text">
  </form>
</body>
</html>
